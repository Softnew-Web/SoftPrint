name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Tipo de incremento da versão
        type: choice
        options: [patch, minor, major]
        default: patch
      mandatory:
        description: Marcar release como atualização obrigatória
        type: boolean
        default: false

concurrency:
  group: softprint-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        !contains(github.event.head_commit.message, 'chore(release):') &&
        !contains(github.event.head_commit.message, '[skip release]')
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            6.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Bump version
        id: version
        shell: pwsh
        run: |
          $bump = "${{ github.event.inputs.bump || 'patch' }}"
          $next = & .\scripts\bump-version.ps1 -Bump $bump
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Nova versão: $next"

      - name: Commit version bump
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION SoftPrint.Domain/SoftPrintVersion.cs installer/SoftPrint.iss
          git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git push origin HEAD:main
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Publish apps
        shell: pwsh
        run: .\scripts\publish-all.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.4.3 -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe não encontrado após instalar o Inno Setup." }
          & $iscc installer\SoftPrint.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "installer\Output\SoftPrint-Setup.exe")) {
            throw "SoftPrint-Setup.exe não foi gerado."
          }

      - name: Package Linux zip
        shell: pwsh
        run: |
          if (Test-Path dist\linux-x64) {
            Compress-Archive -Path dist\linux-x64\* -DestinationPath dist\softprint-linux-x64.zip -Force
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $title = "SoftPrint $ver"
          $notes = @"
          Release automático gerado no push para ``main``.

          Clientes com SoftPrint instalado recebem o aviso de atualização no painel.
          "@
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.mandatory }}" -eq "true") {
            $notes = "[mandatory]`n`n" + $notes
            $title = "$title (obrigatória)"
          }
          if (Test-Path dist\softprint-linux-x64.zip) {
            gh release create "v$ver" `
              "installer/Output/SoftPrint-Setup.exe#SoftPrint-Setup.exe" `
              "dist/softprint-linux-x64.zip#softprint-linux-x64.zip" `
              --title $title `
              --notes $notes
          } else {
            gh release create "v$ver" `
              "installer/Output/SoftPrint-Setup.exe#SoftPrint-Setup.exe" `
              --title $title `
              --notes $notes
          }

name: Release

# Release só sob demanda — evita publicar a cada push na main.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Tipo de incremento da versão
        type: choice
        options: [patch, minor, major]
        default: patch
      mandatory:
        description: Marcar release como atualização obrigatória
        type: boolean
        default: false
      skip_bump:
        description: Republicar a VERSION atual (sem incrementar; use se o bump já rodou)
        type: boolean
        default: false

concurrency:
  group: softprint-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            6.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Build JS bundle
        shell: pwsh
        run: .\scripts\build-js.ps1

      - name: Test
        run: dotnet test SoftPrint.Tests/SoftPrint.Tests.csproj -c Release --verbosity minimal

  release:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            6.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $skip = ("${{ github.event.inputs.skip_bump }}" -eq "true")
          if ($skip) {
            $next = [System.IO.File]::ReadAllText("$PWD\VERSION").Trim().TrimStart([char]0xFEFF)
            if ($next -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION inválida: '$next'" }
            Add-Content -Path $env:GITHUB_ENV -Value "SOFTPRINT_VERSION=$next" -Encoding utf8NoBOM
            Add-Content -Path $env:GITHUB_ENV -Value "SOFTPRINT_SKIP_BUMP=true" -Encoding utf8NoBOM
            Write-Host "Republicando versão existente: $next"
          } else {
            $bump = "${{ github.event.inputs.bump || 'patch' }}"
            & .\scripts\bump-version.ps1 -Bump $bump
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $next = [System.IO.File]::ReadAllText("$PWD\VERSION").Trim().TrimStart([char]0xFEFF)
            if ($next -notmatch '^\d+\.\d+\.\d+$') { throw "Versão inválida após bump: '$next'" }
            Add-Content -Path $env:GITHUB_ENV -Value "SOFTPRINT_VERSION=$next" -Encoding utf8NoBOM
            Add-Content -Path $env:GITHUB_ENV -Value "SOFTPRINT_SKIP_BUMP=false" -Encoding utf8NoBOM
            Write-Host "Nova versão: $next"
          }

      - name: Commit version bump
        shell: pwsh
        run: |
          if ($env:SOFTPRINT_SKIP_BUMP -eq "true") {
            Write-Host "skip_bump: sem commit/tag (já existentes)."
            exit 0
          }
          $ver = $env:SOFTPRINT_VERSION
          if ($ver -notmatch '^\d+\.\d+\.\d+$') {
            $ver = [System.IO.File]::ReadAllText("$PWD\VERSION").Trim().TrimStart([char]0xFEFF)
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "SOFTPRINT_VERSION inválida: '$ver'" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION SoftPrint.Domain/SoftPrintVersion.cs installer/SoftPrint.iss
          git commit -m "chore(release): v$ver"
          git push origin HEAD:main
          git tag "v$ver"
          git push origin "v$ver"

      - name: Publish apps
        shell: pwsh
        run: .\scripts\publish-all.ps1

      - name: Publish symbols (support)
        shell: pwsh
        run: .\scripts\publish-symbols.ps1

      - name: Sign published executables
        env:
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
        shell: pwsh
        run: |
          $exes = Get-ChildItem dist -Recurse -Include SoftPrint.exe,SoftPrint.Legacy.exe,softprint -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\symbols\\' } |
            ForEach-Object { $_.FullName }
          if ($exes.Count -lt 1) { throw "Nenhum SoftPrint.exe encontrado para assinar." }
          .\scripts\sign-authenticode.ps1 -Files $exes -FailIfSecretsMissing:$false

      - name: Guard — sem token embutido
        shell: pwsh
        run: |
          $tokens = Get-ChildItem dist -Recurse -Filter "update-github.token" -File -ErrorAction SilentlyContinue
          if ($tokens) {
            throw "Token embutido encontrado (proibido): $($tokens.FullName -join ', ')"
          }
          Write-Host "OK: nenhum update-github.token nos pacotes."

      - name: Package update zips
        shell: pwsh
        run: .\scripts\package-update-zips.ps1

      - name: Package delta updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: .\scripts\package-delta-updates.ps1 -CurrentVersion $env:SOFTPRINT_VERSION

      - name: Install Inno Setup
        shell: pwsh
        run: |
          function Find-Iscc {
            @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { Write-Warning "choco innosetup saiu com $LASTEXITCODE" }
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe não encontrado." }
          Write-Host "ISCC: $iscc"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "ISCC=$iscc$([Environment]::NewLine)")

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = $env:ISCC
          if (-not $iscc -or -not (Test-Path $iscc)) {
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe não encontrado após instalar o Inno Setup." }
          & $iscc installer\SoftPrint.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "installer\Output\SoftPrint-Setup.exe")) {
            throw "SoftPrint-Setup.exe não foi gerado."
          }

      - name: Sign installer
        env:
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
        shell: pwsh
        run: |
          .\scripts\sign-authenticode.ps1 -Files @(
            "installer\Output\SoftPrint-Setup.exe"
          ) -FailIfSecretsMissing:$false

      - name: Upload symbols artifact
        uses: actions/upload-artifact@v4
        with:
          name: softprint-symbols-${{ env.SOFTPRINT_VERSION }}
          path: dist/symbols
          if-no-files-found: warn
          retention-days: 90

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = $env:SOFTPRINT_VERSION
          if ($ver -notmatch '^\d+\.\d+\.\d+$') {
            $ver = [System.IO.File]::ReadAllText("$PWD\VERSION").Trim().TrimStart([char]0xFEFF)
          }
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "Versão inválida para release: '$ver'" }
          $title = "SoftPrint $ver"
          $mandatory = ("${{ github.event.inputs.mandatory }}" -eq "true")
          if ($mandatory) {
            $title = "$title (obrigatória)"
          }

          $notesFile = "dist\RELEASE_NOTES.md"
          $notesArgs = @{ Version = $ver; OutFile = $notesFile }
          if ($mandatory) { $notesArgs.Mandatory = $true }
          & .\scripts\write-release-notes.ps1 @notesArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $notesFile)) { throw "RELEASE_NOTES.md não foi gerado." }

          .\scripts\write-checksums.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist\checksums.sha256")) {
            throw "checksums.sha256 obrigatório — release abortada."
          }

          $assets = @(
            "installer/Output/SoftPrint-Setup.exe#SoftPrint-Setup.exe"
          )
          $assets += Get-ChildItem dist -Filter "*.zip" -File -ErrorAction SilentlyContinue |
            ForEach-Object { "$($_.FullName)#$($_.Name)" }
          $assets += "dist\checksums.sha256#checksums.sha256"

          $assets = $assets | Where-Object {
            $path = ($_ -split '#')[0]
            Test-Path $path
          }

          if ($assets.Count -lt 2) { throw "Assets insuficientes para publicar (setup + checksums)." }

          git push origin :refs/tags/v 2>$null
          gh release delete "v" -y 2>$null
          gh release delete "v$ver" -y 2>$null

          gh release create "v$ver" @assets --title $title --notes-file $notesFile

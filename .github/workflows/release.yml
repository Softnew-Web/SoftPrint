name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Tipo de incremento da versão
        type: choice
        options: [patch, minor, major]
        default: patch
      mandatory:
        description: Marcar release como atualização obrigatória
        type: boolean
        default: false

concurrency:
  group: softprint-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        !contains(github.event.head_commit.message, 'chore(release):') &&
        !contains(github.event.head_commit.message, '[skip release]')
      )
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            6.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Build JS bundle
        shell: pwsh
        run: .\scripts\build-js.ps1

      - name: Test
        run: dotnet test SoftPrint.Tests/SoftPrint.Tests.csproj -c Release --verbosity minimal

  release:
    needs: test
    runs-on: windows-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        !contains(github.event.head_commit.message, 'chore(release):') &&
        !contains(github.event.head_commit.message, '[skip release]')
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            6.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Bump version
        id: version
        shell: pwsh
        run: |
          $bump = "${{ github.event.inputs.bump || 'patch' }}"
          $next = (& .\scripts\bump-version.ps1 -Bump $bump | Select-Object -Last 1).ToString().Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($next -notmatch '^\d+\.\d+\.\d+$') { throw "Versão inválida: '$next'" }
          # Evitar Out-File -Encoding utf8 (BOM) — quebra o parser do GITHUB_OUTPUT no Windows.
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$next$([Environment]::NewLine)")
          Write-Host "Nova versão: $next"

      - name: Commit version bump
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION SoftPrint.Domain/SoftPrintVersion.cs installer/SoftPrint.iss
          git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git push origin HEAD:main
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Publish apps
        shell: pwsh
        run: .\scripts\publish-all.ps1

      - name: Package update zips
        shell: pwsh
        run: .\scripts\package-update-zips.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress --ignore-checksums
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe não encontrado." }
          Write-Host "ISCC: $iscc"
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "ISCC=$iscc$([Environment]::NewLine)")

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = $env:ISCC
          if (-not $iscc -or -not (Test-Path $iscc)) {
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe não encontrado após instalar o Inno Setup." }
          & $iscc installer\SoftPrint.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "installer\Output\SoftPrint-Setup.exe")) {
            throw "SoftPrint-Setup.exe não foi gerado."
          }

      - name: Sign installer (optional)
        env:
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_PASSWORD: ${{ secrets.CODE_SIGNING_PASSWORD }}
        shell: pwsh
        run: |
          .\scripts\sign-authenticode.ps1 -Files @(
            "installer\Output\SoftPrint-Setup.exe"
          )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $title = "SoftPrint $ver"
          $notes = @"
          Release automático gerado no push para ``main``.

          Clientes Windows preferem o zip leve da arquitetura instalada; o Setup completo continua disponível.
          "@
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ github.event.inputs.mandatory }}" -eq "true") {
            $notes = "[mandatory]`n`n" + $notes
            $title = "$title (obrigatória)"
          }

          $assets = @(
            "installer/Output/SoftPrint-Setup.exe#SoftPrint-Setup.exe",
            "dist/SoftPrint-win-x64.zip#SoftPrint-win-x64.zip",
            "dist/SoftPrint-win-x86.zip#SoftPrint-win-x86.zip",
            "dist/SoftPrint-legacy-x64.zip#SoftPrint-legacy-x64.zip",
            "dist/SoftPrint-legacy-x86.zip#SoftPrint-legacy-x86.zip",
            "dist/softprint-linux-x64.zip#softprint-linux-x64.zip"
          ) | Where-Object {
            $path = ($_ -split '#')[0]
            Test-Path $path
          }

          if ($assets.Count -lt 1) { throw "Nenhum asset para publicar." }

          gh release create "v$ver" @assets --title $title --notes $notes

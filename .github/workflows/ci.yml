name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: softprint-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            6.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Build JS bundle
        shell: pwsh
        run: .\scripts\build-js.ps1

      - name: Test (net10)
        run: dotnet test SoftPrint.Tests/SoftPrint.Tests.csproj -c Release -f net10.0 --verbosity minimal

      - name: Test (net6)
        run: dotnet test SoftPrint.Tests/SoftPrint.Tests.csproj -c Release -f net6.0 --verbosity minimal

  publish-windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            6.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Build JS + publish win-x64
        shell: pwsh
        run: |
          .\scripts\build-js.ps1
          dotnet publish SoftPrint.Host.Windows/SoftPrint.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -o dist/windows-smoke

      - name: Guard — sem token embutido
        shell: pwsh
        run: |
          $tokens = Get-ChildItem dist/windows-smoke -Recurse -Filter "update-github.token" -File -ErrorAction SilentlyContinue
          if ($tokens) { throw "Token embutido no publish smoke." }
          if (-not (Test-Path "dist/windows-smoke/SoftPrint.exe")) { throw "SoftPrint.exe ausente." }

      - name: Smoke diagnose
        shell: pwsh
        run: |
          $out = & "dist\windows-smoke\SoftPrint.exe" --diagnose
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($out -notmatch '(?i)windows') { throw "Diagnóstico sem marker Windows." }

  installer-smoke:
    # Publish completo + Inno é pesado — só na main (ou manual).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            6.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Publish all + Inno Setup
        shell: pwsh
        run: |
          .\scripts\publish-all.ps1
          choco install innosetup --version=6.3.3 -y --no-progress
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe não encontrado." }
          & $iscc installer\SoftPrint.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "installer\Output\SoftPrint-Setup.exe")) {
            throw "SoftPrint-Setup.exe não gerado no smoke."
          }
          $tokens = Get-ChildItem dist -Recurse -Filter "update-github.token" -File -ErrorAction SilentlyContinue
          if ($tokens) { throw "Token embutido encontrado." }
          Write-Host "Inno smoke OK."

  smoke-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            6.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Build JS bundle
        shell: pwsh
        run: ./scripts/build-js.ps1

      - name: Test (net10)
        run: dotnet test SoftPrint.Tests/SoftPrint.Tests.csproj -c Release -f net10.0 --verbosity minimal

      - name: Publish Linux host
        run: >
          dotnet publish SoftPrint.Host.Linux/SoftPrint.Host.Linux.csproj
          -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true
          -o dist/linux-smoke

      - name: Smoke diagnose
        run: |
          set -e
          test -x dist/linux-smoke/softprint
          chmod +x dist/linux-smoke/softprint
          out=$(dist/linux-smoke/softprint --diagnose)
          echo "$out"
          echo "$out" | grep -qi linux
          if ls dist/linux-smoke/update-github.token 2>/dev/null; then
            echo "Token embutido no publish Linux" >&2
            exit 1
          fi
